# Documentation site of bsixsa, built with Zensical (https://zensical.org/docs/):
#   zensical serve    # live preview on http://localhost:8000
#   zensical build    # static site in site/
# The API reference pages are rendered from the docstrings by mkdocstrings
# (Google style); fenced code blocks need pymdown-extensions >= 12.

[project]
site_name = "bsixsa"
site_description = "Bayesian X-ray spectral fitting with PyXspec: nested samplers, MCMC, optimisers and simulation-based inference (SIXSA)."
site_author = "Simon Dupourqué"
repo_name = "renecotyfanboy/bsixsa"
repo_url = "https://github.com/renecotyfanboy/bsixsa"
copyright = "Copyright &copy; 2026 The authors"

nav = [
    { "Home" = [
        "index.md",
    ]},
    { "Examples" = [
        {"Simple fit" = "examples/demo.md"},
        {"NXB / Multi-response" = "examples/nxb.md"},
        {"MCMC from the best fit" = "examples/ulx.md"},
    ]},
    { "Reference" = [
        {"Solver" = "reference/solver.md"},
        {"Priors" = "reference/priors.md"},
        {"History matching" = "reference/restriction.md"},
        {"Backends" = "reference/backend.md"},
        {"SIXSA validation" = "reference/sixsa-validation.md"},
        {"Plotting" = "reference/plotter.md"},
        {"XSPEC" = "reference/xspec.md"},
        {"XSPEC chain export" = "reference/export.md"},
    ]},
]

# MathJax renders the $...$ and $$...$$ formulas of the docstrings (see pymdownx.arithmatex below).
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"
]

[project.theme]
favicon = "logo/logo_small.svg"
logo = "logo/logo_small.svg"
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

# Light and dark colour schemes, with a toggle in the header.
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.blocks.caption]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
extensions = [
    { griffe_pydantic = { schema = false } },
]
inherited_members = true
# A class opens with its description, and its constructor's parameters are listed with it
# (the one-line summary of __init__ is dropped). A wrapped Returns/Yields description is
# one item, not one typed row per line.
merge_init_into_class = true
docstring_options = { ignore_init_summary = true, returns_multiple_items = false }
# Members (and configuration fields) in the order the source groups them, not alphabetically.
members_order = "source"
show_source = false
# Short headings; the full signature is shown below each one.
separate_signature = true
show_symbol_type_toc = true
show_symbol_type_heading = true
