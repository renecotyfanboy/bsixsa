[project]
name = "bsixsa"
version = "0.2.0"
description = "Friendly BXA interface for SIXSA"
readme = "README.md"
authors = [
    { name = "renecotyfanboy", email = "sdupourque@irap.omp.eu" }
]
requires-python = ">=3.11"
dependencies = [
    "arviz<1.0.0",
    "astropy>=7.2.0",
    "chainconsumer>=1.1.3",
    "cma>=4.0.0",
    "cmasher>=1.9.2",
    "dill>=0.3.9",
    "joblib>=1.3",
    "matplotlib>=3.10.1",
    "numpy>=1.26.4",
    "pathos>=0.3.3",
    "pydantic>=2.12.5",
    "sbi>=0.27,<0.28",
    "scipy>=1.15",
    "seaborn>=0.13.2",
    "torch>=2.5",
    "tqdm>=4.67.1",
    "zuko>=1.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-timeout>=2.3",
]
doc = [
    "griffe-pydantic",
    "mkdocstrings-python>=2.0.3",
    "zensical>=0.0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-running tests (end-to-end variants, parallel training, nautilus)",
    "xspec: requires a real PyXspec session (conda activate bsixsa)",
    "e2e: end-to-end runs through Solver.run",
]
