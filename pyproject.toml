[project]
name = "bsixsa"
version = "0.1.2"
description = "Friendly BXA interface for SIXSA"
readme = "README.md"
authors = [
    { name = "renecotyfanboy", email = "sdupourque@irap.omp.eu" }
]
requires-python = ">=3.11"
dependencies = [
    "arviz<1.0.0",
    "astropy>=7.2.0",
    "catppuccin>=2.4.1",
    "chainconsumer>=1.1.3",
    "cma>=4.0.0",
    "cmasher>=1.9.2",
    "dill>=0.3.9",
    "matplotlib>=3.10.1",
    "numpy>=1.26.4",
    "pathos>=0.3.3",
    "pydantic>=2.12.5",
    "scipy>0.16",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
doc = [
    "griffe-pydantic",
    "mkdocstrings-python>=2.0.3",
    "zensical>=0.0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
