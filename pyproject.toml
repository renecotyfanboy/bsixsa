[project]
name = "bsixsa"
version = "0.1.0"
description = "Friendly BXA interface for SIXSA"
readme = "README.md"
authors = [
    { name = "renecotyfanboy", email = "sdupourque@irap.omp.eu" }
]
requires-python = ">=3.12"
dependencies = [
    "arviz<1.0.0",
    "astropy>=7.2.0",
    "catppuccin>=2.4.1",
    "chainconsumer>=1.1.3",
    "cmasher>=1.9.2",
    "dill>=0.3.9",
    "matplotlib>=3.10.1",
    "mkdocstrings-python>=2.0.3",
    "numpy>=1.26.4",
    "pathos>=0.3.3",
    "sbi>=0.25.0",
    "scipy>0.16",
    "seaborn>=0.13.2",
    "torch>=2.5.1",
    "tqdm>=4.67.1",
    "zensical>=0.0.28",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
