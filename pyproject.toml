[project]
name = "bsixsa"
version = "0.2.0"
description = "Bayesian X-ray spectral fitting with PyXspec: nested sampling, MCMC, optimisers and SIXSA simulation-based inference"
readme = "README.md"
authors = [
    { name = "renecotyfanboy", email = "sdupourque@irap.omp.eu" }
]
requires-python = ">=3.11"
dependencies = [
    "arviz<1.0.0",
    "astropy>=7.2.0",
    "matplotlib>=3.10.1",
    "numpy>=1.26.4",
    "pandas>=2.0",
    "pathos>=0.3.3",
    "pydantic>=2.12.5",
    "sbi>=0.27,<0.28",
    "scipy>=1.15",
    "torch>=2.5",
    "tqdm>=4.67.1",
    "zuko>=1.5",
]

# The samplers other than SIXSA are optional: install the ones you use,
# e.g. `pip install "bsixsa[nautilus]"`, or all of them with `bsixsa[all]`.
[project.optional-dependencies]
nautilus = ["nautilus-sampler>=1.0"]
nessai = ["nessai>=0.15"]
ultranest = ["ultranest>=4.0"]
iminuit = ["iminuit>=2.0"]
emcee = ["emcee>=3.0"]
all = [
    "emcee>=3.0",
    "iminuit>=2.0",
    "nautilus-sampler>=1.0",
    "nessai>=0.15",
    "ultranest>=4.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-timeout>=2.3",
]
doc = [
    "griffe-pydantic",
    "mkdocstrings-python>=2.0.3",
    # Older releases silently drop every fenced code block with Markdown >= 3.10.
    "pymdown-extensions>=12",
    "zensical>=0.0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-running tests (end-to-end variants, parallel training, nautilus)",
    "xspec: requires a real PyXspec session (conda activate bsixsa)",
    "e2e: end-to-end runs through Solver.run",
]
